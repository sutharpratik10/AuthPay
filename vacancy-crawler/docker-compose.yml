services:
api:
build: .
ports:
- "8000:8000"
environment:
MONGODB_URL: mongodb://mongo:27017
MONGODB_DB: scrapped_jobs
SCRAPER_UA: OpenJobsBot/1.0 (+contact: jobs@example.com)
STORAGE_BACKEND: mongo
depends_on:
- mongo
mongo:
image: mongo:7
ports:
- "27017:27017"
volumes:
- mongo_data:/data/db
volumes:
mongo_data: