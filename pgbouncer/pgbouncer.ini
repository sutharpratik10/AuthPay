[databases]
# Map the 'Authpay_db' alias to the actual PostgreSQL database running natively on port 5432
Authpay_db = host=127.0.0.1 port=5432 dbname=Authpay_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

# Authentication settings
# For production, use auth_type = md5 and generate md5 hashes for the userlist.txt.
# We are using 'plain' here to match the local example configuration.
auth_type = plain
auth_file = userlist.txt

# Connection Pooling settings
# Transaction mode is optimal for web applications (Next.js/Drizzle/Prisma)
pool_mode = transaction

# Allow up to 5000 concurrent client connections from Next.js (HAProxy rate limiter drops at 1000/10s, so this is plenty)
max_client_conn = 5000

# Maintain 50 actual connections to the PostgreSQL server
default_pool_size = 50

# Fallback connections if the default pool is exhausted
reserve_pool_size = 10
reserve_pool_timeout = 5

# Logging (reduced for high-performance testing)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
