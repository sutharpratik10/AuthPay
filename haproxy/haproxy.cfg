global
    log 127.0.0.1 local0
    maxconn 50000
    # daemon # Uncomment if running as a background service on Linux

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:8080
    
    # Rate Limiting Setup
    # Track IP addresses in a stick-table
    # Store request rate over the last 10 seconds
    stick-table type ip size 1m expire 10s store http_req_rate(10s)
    
    # Track the source IP for each request
    http-request track-sc0 src
    
    # Deny if the request rate exceeds 1000 requests per 10 seconds
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 1000 }
    
    default_backend nextjs_cluster

backend nextjs_cluster
    # In this non-Docker setup, PM2 will run Next.js in cluster mode on port 3000.
    # HAProxy acts purely as an edge rate-limiter and forwards traffic to the PM2 cluster.
    server node1 127.0.0.1:3000 maxconn 50000
